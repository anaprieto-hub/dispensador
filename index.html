<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispensador de gaseosas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f6f8fa; --tarjeta: #ffffff; --tinta: #14212e; --suave: #5b6b7a;
    --linea: #c0eef7; --azul: #1d3b5c; --ok: #1f7a4d; --ok-bg: #dff1e7;
    --mal: #b3261e; --mal-bg: #f8e1df; --aviso: #8a5a00; --aviso-bg: #fbefd2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: "Barlow", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 96px; }
  h1, h2, .num { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; margin: 0; }
  h1 { font-size: 2.2rem; }
  .conexion { color: var(--suave); margin: 4px 0 24px; }
  .conexion.caida { color: var(--mal); }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .tarjeta { background: var(--c-fondo, var(--tarjeta)); border: 1px solid var(--c-borde, var(--linea)); border-radius: 12px; padding: 20px; }
  .tarjeta .fila span:first-child { color: #44525f; }
  .tarjeta h2 { font-size: 1.6rem; }
  .cabecera { display: flex; align-items: center; gap: 12px; }
  .logo { width: 56px; height: 56px; object-fit: contain; }
  .logo[hidden] { display: none; }

  /* Colores pastel de cada gaseosa (cámbialos aquí): fondo, borde y color del botón y la barra */
  .c1 { --c-fondo: #fbdcdc; --c-borde: #eaa9ac; --c-acento: #a82330; }  /* Coca-Cola: rojo */
  .c2 { --c-fondo: #d9e8fb; --c-borde: #a9c8ee; --c-acento: #1f4f8f; }  /* Pepsi: azul */
  .c3 { --c-fondo: #ddf2d6; --c-borde: #b0dca4; --c-acento: #2f6b2f; }  /* Manzana: verde manzana */
  .c4 { --c-fondo: #fbf2c4; --c-borde: #ecdc88; --c-acento: #7a6400; }  /* Quatro: amarillo limón */
  .c5 { --c-fondo: #e6dcf7; --c-borde: #c4b0e8; --c-acento: #5b3a8f; }  /* Uva: morado */
  .fila { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
  .fila span:first-child { color: var(--suave); }
  .num { font-size: 2.4rem; }
  .barra { height: 12px; background: rgba(255, 255, 255, .65); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .barra div { height: 100%; width: 0; background: var(--c-acento, var(--azul)); transition: width .4s; }
  .insignia { display: inline-block; margin-top: 16px; padding: 6px 12px; border-radius: 6px; font-weight: 500; border: 1px solid currentColor; }
  .insignia.ok { background: var(--ok-bg); color: var(--ok); }
  .insignia.mal { background: var(--mal-bg); color: var(--mal); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--azul); padding: 10px 18px; }
  button.principal { background: var(--c-acento, var(--azul)); border-color: var(--c-acento, var(--azul)); color: #fff; margin-top: 16px; width: 100%; }
  button.principal:disabled { background: var(--linea); border-color: var(--linea); color: var(--suave); cursor: not-allowed; }
  button.secundario { background: transparent; color: var(--c-acento, var(--azul)); border-color: var(--c-acento, var(--azul)); }
  button:focus-visible { outline: 3px solid #5b9bd5; outline-offset: 2px; }
  dialog { background: var(--c-fondo, var(--tarjeta)); color: var(--tinta); border: 1px solid var(--c-borde, var(--linea)); border-radius: 12px; padding: 24px; width: min(360px, 92vw); }
  dialog::backdrop { background: rgba(20, 33, 46, .5); }
  .tamanos { display: grid; gap: 10px; margin: 16px 0; }
  .tamanos button { background: #ffffff; border-color: var(--c-acento, var(--azul)); font-size: 1.1rem; padding: 14px; }
  .tamanos button:hover:not(:disabled) { background: var(--fondo); }
  .tamanos button:disabled { color: var(--suave); border-color: var(--linea); cursor: not-allowed; }
  .aviso { min-height: 1.4em; color: var(--aviso); }
  #estado { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 16px; text-align: center;
            font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.5rem; }
  #estado.libre { background: var(--tarjeta); color: var(--suave); border-top: 1px solid var(--linea); }
  #estado.sirviendo { background: var(--aviso-bg); color: var(--aviso); }
  #estado.lista { background: var(--ok-bg); color: var(--ok); }
  #estado.sin_vaso, #estado.nivel_insuficiente { background: var(--mal-bg); color: var(--mal); }
</style>
</head>
<body>
<main>
  <h1>Dispensador de gaseosas</h1>
  <p class="conexion" id="conexion">Conectando…</p>

  <div class="rejilla">

    <!-- ===== 1. COCA-COLA (con datos: temperatura y nivel) ===== -->
    <section class="tarjeta c1" id="tarjeta-1">
      <div class="cabecera">
        <img class="logo" src="cocacola.png" alt="Logo Coca-Cola">
        <h2>Coca-Cola</h2>
      </div>
      <div class="fila"><span>Nivel</span><span class="num"><span data-nivel>--</span> L</span></div>
      <div class="barra"><div data-barra></div></div>
      <span class="insignia mal" data-insignia>Sin datos</span>
      <button class="principal" data-pedir="1" disabled>Pedir</button>
    </section>

    <!-- ===== 2. sprite (con datos: nivel) ===== -->
    <section class="tarjeta c2" id="tarjeta-2">
      <div class="cabecera">
        <img class="logo" src="Screenshot 2026-11-12 093849.png" alt="Logo sprite">
        <h2>Pepsi</h2>
      </div>
      <div class="fila"><span>Nivel</span><span class="num"><span data-nivel>--</span> L</span></div>
      <div class="barra"><div data-barra></div></div>
      <span class="insignia mal" data-insignia>Sin datos</span>
      <button class="principal" data-pedir="2" disabled>Pedir</button>
    </section>

    <!-- ===== 3. MANZANA (sin sensor: solo pedir) ===== -->
    <section class="tarjeta c3" id="tarjeta-3">
      <div class="cabecera">
        <img class="logo" src="logo_manzana_postobon.png" alt="Logo Manzana">
        
        <h2>Manzana</h2>
      </div>
      <button class="principal" data-pedir="3">Pedir</button>
    </section>

    <!-- ===== 4. QUATRO (sin sensor: solo pedir) ===== -->
    <section class="tarjeta c4" id="tarjeta-4">
      <div class="cabecera">
        <img class="logo" src="images.jpg" alt="Logo Quatro">
        
        <h2>Quatro</h2>
      </div>
      <button class="principal" data-pedir="4">Pedir</button>
    </section>

    <!-- ===== 5. UVA (sin sensor: solo pedir) ===== -->
    <section class="tarjeta c5" id="tarjeta-5">
      <div class="cabecera">
        <img class="logo" src="postobon_informacion_nutriconallogo-uva-p-e1687378302720.png" alt="Logo Uva">
        <h2>Uva</h2>
      </div>
      <button class="principal" data-pedir="5">Pedir</button>
    </section>

  </div>
</main>

<dialog id="dialogo">
  <div class="cabecera">
    <img class="logo" id="dlg-logo" src="cocacola.png" alt="">
    <h2 id="dlg-titulo">Coca-Cola</h2>
  </div>
  <p>Cantidad</p>
  <div class="tamanos">
    <button data-oz="7">7 oz</button>
    <button data-oz="9">9 oz</button>
    <button data-oz="12">12 oz</button>
  </div>
  <p class="aviso" id="dlg-aviso"></p>
  <button class="secundario" id="cerrar">Cerrar</button>
</dialog>

<div id="estado" class="libre" role="status">Listo para servir</div>

<script>
// ============ CAMBIA SOLO ESTAS DOS LÍNEAS ============
const DB_URL = "https://dispensador-de-gaseosa-default-rtdb.firebaseio.com";  // la misma que en la ESP32
const CAPACIDAD_L = 3.0;   // litros de tu botella (3 L)
// ======================================================

const BASE = DB_URL.replace(/\/+$/, "");   // quita la "/" final si la hay

const MENSAJES = {
  libre: "Listo para servir",
  apagado: "El dispensador está apagado",
  sirviendo: "Ya se está sirviendo su bebida",
  lista: "Su bebida está lista",
  sin_vaso: "No hay vaso, por favor verifique",
  nivel_insuficiente: "No hay suficiente bebida para esa cantidad"
};

const NOMBRES = { 1: "Coca-Cola", 2: "sprite", 3: "Manzana", 4: "Quatro", 5: "Uva" };

// Logos de la ventana de cantidad. Para agregar uno, cambia null por el nombre de la imagen.
const LOGOS = {
  1: "cocacola.png",
  2: "Screenshot 2026-11-12 093849.png",
  3: "logo_manzana_postobon.png",
  4: "images.jpg",
  5: "postobon_informacion_nutriconallogo-uva-p-e1687378302720.png"
};

const SIN_SENSOR = [3, 4, 5];   // bebidas sin sensor: no muestran datos
const OZ_POR_LITRO = 33.814;
let datos = { 1: null, 2: null };
let bebidaActual = 1;
let ultimoTs = null, ultimoCambio = Date.now();

const $ = (s, r = document) => r.querySelector(s);

async function leer(ruta) {
  const r = await fetch(`${BASE}${ruta}.json`);
  return r.json();
}

function pintarTarjeta(n, g) {
  const t = $(`#tarjeta-${n}`);
  if (!g) return;
  const nivelValido = g.nivel >= 0;
  const tempValida = g.temp > -100;
  const disponible = g.disponible && nivelValido;
  const elTemp = $("[data-temp]", t);   // la Pepsi no tiene sensor de temperatura
  if (elTemp) elTemp.textContent = tempValida ? Number(g.temp).toFixed(1) : "--";
  $("[data-nivel]", t).textContent = nivelValido ? Number(g.nivel).toFixed(2) : "--";
  $("[data-barra]", t).style.width = nivelValido ? Math.min(100, g.nivel / CAPACIDAD_L * 100) + "%" : "0%";
  const ins = $("[data-insignia]", t);
  ins.textContent = !nivelValido ? "Sin lectura del sensor" : (disponible ? "Disponible" : "No disponible");
  ins.className = "insignia " + (disponible ? "ok" : "mal");
  $("[data-pedir]", t).disabled = !disponible;
}

async function actualizarDatos() {
  try {
    const d = await leer("/gaseosas");
    if (d) {
      datos = { 1: d.g1, 2: d.g2 };
      pintarTarjeta(1, d.g1);
      pintarTarjeta(2, d.g2);
      if (d.ts !== ultimoTs) { ultimoTs = d.ts; ultimoCambio = Date.now(); }
    }
  } catch (e) { /* se refleja en el indicador de conexión */ }

  const viva = Date.now() - ultimoCambio < 20000;
  const c = $("#conexion");
  c.textContent = viva ? "Conectado al dispensador" : "Sin conexión con el dispensador";
  c.classList.toggle("caida", !viva);

  // Las bebidas sin sensor solo se pueden pedir si el dispensador está conectado
  SIN_SENSOR.forEach(n => { $(`#tarjeta-${n} [data-pedir]`).disabled = !viva; });
}

async function actualizarEstado() {
  try {
    const e = await leer("/estado");
    const clave = (e && e.mensaje) || "libre";
    const barra = $("#estado");
    barra.className = clave;
    barra.textContent = MENSAJES[clave] || clave;
  } catch (e) {}
}

// Ventana de cantidad
document.querySelectorAll("[data-pedir]").forEach(b => {
  b.addEventListener("click", () => {
    bebidaActual = Number(b.dataset.pedir);
    const sinSensor = SIN_SENSOR.includes(bebidaActual);

    $("#dialogo").className = "c" + bebidaActual;   // color pastel de la gaseosa
    $("#dlg-titulo").textContent = NOMBRES[bebidaActual];

    const logo = $("#dlg-logo");
    if (LOGOS[bebidaActual]) {
      logo.src = LOGOS[bebidaActual];
      logo.hidden = false;
    } else {
      logo.hidden = true;
    }

    $("#dlg-aviso").textContent = "";

    // Con sensor: se bloquean las cantidades que no alcanzan. Sin sensor: todas disponibles.
    const disponibleOz = (datos[bebidaActual]?.nivel || 0) * OZ_POR_LITRO;
    document.querySelectorAll("[data-oz]").forEach(btn => {
      btn.disabled = sinSensor ? false : Number(btn.dataset.oz) > disponibleOz;
    });
    if (!sinSensor && disponibleOz < 12) {
      $("#dlg-aviso").textContent = `Solo quedan ${disponibleOz.toFixed(1)} oz de esta gaseosa.`;
    }

    $("#dialogo").showModal();
  });
});
$("#cerrar").addEventListener("click", () => $("#dialogo").close());

// Enviar el pedido a la ESP32 (a través de Firebase)
document.querySelectorAll("[data-oz]").forEach(btn => {
  btn.addEventListener("click", async () => {
    $("#dialogo").close();
    const pedido = { activo: true, bebida: bebidaActual, onzas: Number(btn.dataset.oz) };
    await fetch(`${BASE}/pedido.json`, { method: "PUT", body: JSON.stringify(pedido) });
  });
});

actualizarDatos(); actualizarEstado();
setInterval(actualizarDatos, 3000);
setInterval(actualizarEstado, 1500);
</script>
</body>
</html>
